<!DOCTYPE html>
<html lang="en">

    <title>Z Fabrics | Premium Retail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafafa; color: #111; }
        
        /* Navbar Style */
        .nav-glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #eee; }
        
        /* Professional Square Card */
        .product-card { 
            background: #fff; 
            border-radius: 12px; /* Smooth Corners */
            overflow: hidden;
            border: 1px solid #eaeaea;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }

        /* Aspect Ratio Square for Images */
        .img-square { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #f3f3f3; overflow: hidden; }
        .fabric-img { width: 100%; height: 100%; object-fit: cover; }
