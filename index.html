<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Fabrics | Premium Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f7f7f7; font-family: sans-serif; }
        .category-header { background: #1a1a1a; color: white; padding: 12px; margin: 20px 0; border-radius: 6px; font-weight: bold; text-align: center; }
        .product-card { background: white; border-radius: 12px; border: 1px solid #eee; overflow: hidden; display: flex; flex-direction: column; }
        .img-box { width: 100%; aspect-ratio: 1/1; background: #efefef; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .wa-btn { background: #000; color: #fff; padding: 10px; text-align: center; font-weight: bold; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>
    <div class="p-6 text-center bg-white border-b sticky top-0 z-50">
        <h1 class="text-3xl font-black">Z FABRICS</h1>
        <p class="text-[10px] text-gray-400 uppercase tracking-widest">Khanpur, Punjab</p>
    </div>

    <div class="container mx-auto px-4 pb-20 max-w-4xl">
        
        <div class="category-header">Premium Cotton Collection</div>
        <div class="grid grid-cols-2 gap-4">
            
            <div class="product-card">
                <div class="img-box">
                    <img src="images (1).jpeg" alt="Z Fabrics Cotton">
                </div>
                <div class="p-4 text-center flex-grow">
                    <p class="font-bold text-sm">Royal White Cotton</p>
                    <p class="text-amber-800 font-bold mt-1">Rs. 3,250</p>
                </div>
                <a href="https://wa.me/923299878357?text=Mujhe Royal White Cotton chahiye" class="wa-btn">WhatsApp Order</a>
            </div>

        </div>

        <div class="category-header">Wash & Wear Collection</div>
        <div class="grid grid-cols-2 gap-4">
            
            <div class="product-card">
                <div class="img-box">
                    <img src="https://placehold.co/400x400?text=Wash+Wear+Photo" alt="Wash Wear">
                </div>
                <div class="p-4 text-center flex-grow">
                    <p class="font-bold text-sm">Charcoal Grey W&W</p>
                    <p class="text-amber-800 font-bold mt-1">Rs. 2,950</p>
                </div>
                <a href="https://wa.me/923299878357?text=Mujhe Charcoal Grey Wash Wear chahiye" class="wa-btn">WhatsApp Order</a>
            </div>

        </div>

    </div>
</body>
</html>
